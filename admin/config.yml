backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway must be enabled in the Netlify dashboard
# (Site settings > Identity > Enable, and Identity > Services > Git Gateway)
# before this admin panel can log anyone in.

media_folder: "assets/img/jobs"
public_folder: "/assets/img/jobs"

site_url: https://premiuminsulationny.com
display_url: https://premiuminsulationny.com
logo_url: /assets/img/PremiumInsulation-Logo.png

collections:
  - name: "portfolio"
    label: "Job Portfolio"
    label_singular: "Job"
    files:
      - name: "jobs"
        label: "Before & After Jobs"
        description: "Add, edit, reorder, or remove the before/after jobs shown on the Portfolio page."
        file: "content/jobs.json"
        format: "json"
        fields:
          - label: "Jobs"
            name: "jobs"
            widget: "list"
            summary: "{{fields.title}} — {{fields.county}}"
            collapsed: true
            minimize_collapsed: true
            label_singular: "Job"
            fields:
              # The page address for each job is built from its title, so a
              # rename moves the page. Warned about here because there is no
              # other place the client would find that out.
              - { label: "Job Title", name: "title", widget: "string", hint: "e.g. Red Hook Colonial — Attic Retrofit. Renaming a job also changes its web address, so any link you have already shared for it will stop working." }
              - label: "County"
                name: "county"
                widget: "select"
                options: ["Dutchess", "Columbia", "Ulster", "Greene", "Rensselaer", "Albany"]
              - label: "Service Type"
                name: "serviceType"
                widget: "select"
                options: ["Spray Foam", "Cellulose", "Soundproofing"]
              # Photo size is guidance only — Decap cannot enforce a maximum on
              # the default git-backed media library, and every upload is
              # committed to the repository permanently. Visitors always get a
              # resized copy via Netlify Image CDN, so this is about repo
              # growth, not page speed.
              - { label: "Before Photo", name: "beforeImage", widget: "image", hint: "Photos under about 2 MB are ideal. Larger ones still work — visitors are always sent a smaller, resized copy — but big files add up in the site's storage over time." }
              - { label: "After Photo", name: "afterImage", widget: "image", hint: "Take this from the same spot as the Before photo where you can, so the drag-to-compare slider lines up. Same 2 MB guidance as above." }
              - label: "Gallery Photos"
                name: "gallery"
                widget: "list"
                field: { label: "Photo", name: "photo", widget: "image" }
                min: 0
                max: 6
                required: false
                hint: "Up to 6 extra photos showing the full scope of the job, shown on the job's detail page alongside the Before/After pair above. Aim for under about 2 MB each."
              - { label: "Caption", name: "caption", widget: "text", required: false, hint: "One sentence describing the job." }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, default: "" }
