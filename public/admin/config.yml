# ---------------------------------------------------------------------------
# Login: DecapBridge (replaces Netlify Identity + Git Gateway). Clients sign
# in with email + password, Google or Microsoft; no GitHub account needed.
#
# PLACEHOLDER until the DecapBridge site is created: paste the backend block
# DecapBridge generates (Dashboard > site > config.yml) over the one below.
# It is not secret. Keep `branch: cloudflare-test` while testing, so test
# edits never touch the live Netlify site; change it to `main` at launch.
# ---------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: realtyspan/premium_insulation
  branch: cloudflare-test
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/REPLACE-WITH-DECAPBRIDGE-SITE-ID/pkce
  auth_token_endpoint: /sites/REPLACE-WITH-DECAPBRIDGE-SITE-ID/token
  gateway_url: https://gateway.decapbridge.com
  # Each save is recorded with the editor's name, so the history shows who changed what.
  commit_messages:
    create: "Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    update: "Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    delete: "Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    uploadMedia: "Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    deleteMedia: "Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    openAuthoring: "Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge"

# Lets DecapBridge's Google / Microsoft / password logins show the editor's name.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Paths are inside the repo; only public/ is published.
media_folder: "public/assets/img/jobs"
public_folder: "/assets/img/jobs"

# The preview address until launch, then https://premiuminsulationny.com
site_url: https://premium-insulation.dataderivation.workers.dev
display_url: https://premium-insulation.dataderivation.workers.dev
logo_url: /assets/img/PremiumInsulation-Logo.png

collections:
  - name: "portfolio"
    label: "Job Portfolio"
    label_singular: "Job"
    files:
      - name: "jobs"
        label: "Before & After Jobs"
        description: "Add, edit, reorder, or remove the before/after jobs shown on the Portfolio page."
        file: "public/content/jobs.json"
        format: "json"
        fields:
          - label: "Jobs"
            name: "jobs"
            widget: "list"
            summary: "{{fields.title}} — {{fields.county}}"
            collapsed: true
            minimize_collapsed: true
            label_singular: "Job"
            fields:
              # The page address for each job is built from its title, so a
              # rename moves the page. Warned about here because there is no
              # other place the client would find that out.
              - { label: "Job Title", name: "title", widget: "string", hint: "e.g. Red Hook Colonial — Attic Retrofit. Renaming a job also changes its web address, so any link you have already shared for it will stop working." }
              - label: "County"
                name: "county"
                widget: "select"
                options: ["Dutchess", "Columbia", "Ulster", "Greene", "Rensselaer", "Albany"]
              - label: "Service Type"
                name: "serviceType"
                widget: "select"
                options: ["Spray Foam", "Cellulose", "Soundproofing"]
              # 1 MB is not an arbitrary round number: Git Gateway proxies
              # GitHub's Contents API, which only returns file content inline
              # up to 1 MB (1,048,576 bytes). Past that the content field comes
              # back empty unless the raw media type is requested — which is a
              # strong candidate for thumbnails rendering blank in this editor
              # even though the upload itself commits fine.
              #
              # Guidance only: Decap cannot enforce a maximum on the default
              # git-backed media library, and every upload is committed to the
              # repository permanently. On the real domain visitors get a
              # resized copy via Cloudflare image resizing (js/portfolio-common.js);
              # the workers.dev preview serves photos as uploaded.
              - { label: "Before Photo", name: "beforeImage", widget: "image", hint: "Keep photos under about 1 MB. Larger ones still upload and still display correctly on the site, but their thumbnail may not preview here in the editor." }
              - { label: "After Photo", name: "afterImage", widget: "image", hint: "Take this from the same spot as the Before photo where you can, so the drag-to-compare slider lines up. Same 1 MB guidance as above." }
              - label: "Gallery Photos"
                name: "gallery"
                widget: "list"
                field: { label: "Photo", name: "photo", widget: "image" }
                min: 0
                max: 6
                required: false
                hint: "Up to 6 extra photos showing the full scope of the job, shown on the job's detail page alongside the Before/After pair above. Keep each under about 1 MB."
              - { label: "Caption", name: "caption", widget: "text", required: false, hint: "One sentence describing the job." }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, default: "" }
