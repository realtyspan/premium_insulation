# ---------------------------------------------------------------------------
# Login: DecapBridge (replaces Netlify Identity + Git Gateway). Clients sign
# in with email + password, Google or Microsoft; no GitHub account needed.
#
# DecapBridge site "Premium Insulation" (created 2026-11-23). The block below
# comes from DecapBridge (Dashboard > site > config.yml); it is not secret. Keep `branch: cloudflare-test` while testing, so test
# edits never touch the live Netlify site; change it to `main` at launch.
# ---------------------------------------------------------------------------
backend:
  name: git-gateway
  repo: realtyspan/premium_insulation
  branch: cloudflare-test
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d3576d04-34f5-4eb1-aab1-659cced52410/pkce
  auth_token_endpoint: /sites/d3576d04-34f5-4eb1-aab1-659cced52410/token
  gateway_url: https://gateway.decapbridge.com
  # Each save is recorded with the editor's name, so the history shows who changed what.
  commit_messages:
    create: "Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    update: "Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    delete: "Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    uploadMedia: "Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    deleteMedia: "Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    openAuthoring: "Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge"

# Lets DecapBridge's Google / Microsoft / password logins show the editor's name.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Paths are inside the repo; only public/ is published.
media_folder: "public/assets/img/jobs"
public_folder: "/assets/img/jobs"

# The preview address until launch, then https://premiuminsulationny.com
site_url: https://premium-insulation.dataderivation.workers.dev
display_url: https://premium-insulation.dataderivation.workers.dev
logo_url: /assets/img/PremiumInsulation-Logo.png

collections:
  # One file per job (public/content/jobs/<slug>.json). The client sees a plain
  # list of jobs with a "New Job" button and edits one short form at a time.
  # .tools/build_jobs.py combines the files into content/jobs.json on every
  # publish. The file name is fixed when a job is first saved and becomes its
  # web address, so renaming a job later does NOT change or break its link.
  - name: "jobs"
    label: "Jobs"
    label_singular: "Job"
    description: "Your before & after jobs. Click a job to change it, or the + Job button to add one. Newest jobs show first on the website."
    folder: "public/content/jobs"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{county}}"
    # "Sort by" menu. (A default sort order is not supported by this Decap
    # version: the object form fails config validation.)
    sortable_fields: ["date", "title", "county"]
    # The side-by-side preview showed raw text and confused editors; the form
    # gets the whole screen instead.
    editor:
      preview: false
    fields:
      - label: "Job name"
        name: "title"
        widget: "string"
        hint: "A short name for the job, e.g. \"Red Hook Colonial Attic\". You can change it later."
      - label: "County"
        name: "county"
        widget: "select"
        options: ["Dutchess", "Columbia", "Ulster", "Greene", "Rensselaer", "Albany"]
      - label: "Type of work"
        name: "serviceType"
        widget: "select"
        options: ["Spray Foam", "Cellulose", "Soundproofing"]
      # Photos are committed to git permanently and Decap cannot limit their
      # size; on the real domain Cloudflare resizes them for visitors
      # (js/portfolio-common.js). Above ~1 MB the editor's own thumbnail may
      # show blank (GitHub Contents API inline limit) although the upload works.
      - label: "BEFORE photo"
        name: "beforeImage"
        widget: "image"
        choose_url: false
        hint: "The space before you started. Photos straight from a phone are fine."
      - label: "AFTER photo"
        name: "afterImage"
        widget: "image"
        choose_url: false
        hint: "The finished job. Taken from the same spot as the Before photo, the website lets visitors slide between the two."
      - label: "Short description"
        name: "caption"
        widget: "text"
        required: false
        hint: "Optional. One sentence about the job, e.g. \"Attic sealed with closed-cell spray foam.\""
      - label: "More photos"
        name: "gallery"
        widget: "list"
        label_singular: "photo"
        field: { label: "Photo", name: "photo", widget: "image", choose_url: false }
        max: 6
        required: false
        hint: "Optional. Up to 6 more photos of the job, shown on the job's own page."
      - label: "Date of the job"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MM/DD/YYYY"
        time_format: false
        default: "{{now}}"
        hint: "Today's date is filled in for you. Newer jobs show first."
